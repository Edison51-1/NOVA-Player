name: Build NOVA Player

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NOVA-Player-Windows
            archive: dist/NOVA-Player-Windows.zip
          - os: ubuntu-22.04
            artifact: NOVA-Player-Linux
            archive: dist/NOVA-Player-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libpulse0 libdbus-1-3

      - name: Installer les dépendances Python
        run: pip install -r requirements-build.txt

      - name: Générer l'icône
        run: python tools/make_icon.py

      - name: Compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name NOVA-Player --icon assets/icon.ico `
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtPdf main.py
          Compress-Archive -Force -Path dist/NOVA-Player -DestinationPath dist/NOVA-Player-Windows.zip

      - name: Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --windowed --name NOVA-Player --icon assets/icon.png \
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtPdf main.py
          tar -C dist -czf dist/NOVA-Player-Linux.tar.gz NOVA-Player

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}

      - name: Publier la release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
